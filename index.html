<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hunt Tracker</title>
    <link rel="stylesheet" type="text/css" href="css/global.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="js/pb.js"></script>
    <script src="js/index.js"></script>
    <script type="module" src="js/auth.js"></script>
</head>
<body class="landing-page">

<!-- This page is the landing page that a user first sees when visiting the URL. -->

  <header id="header">
    <div id="title-box">
        <h1> Hunt Tracker </h1>
    </div><!-- #title-box -->

    <nav id="nav">
        <ul id="primary-nav">
            <li><a href="#" class="selected">Login</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
  </header><!-- #header -->

  <main id="content">
      <div id="login-center">
          <!-- Logo designed by me in Microsoft Paint -->
          <img id="main-logo" src="images/logo.png" alt="Hunt Tracker Logo">
          <h2 id="slogan">Record your hunting history.</h2>
          <form id="login-box">
              <label for="login-email" class="hidden">Email</label>
              <input type="email" id="login-email" placeholder="Email" required>
<!--              <br>-->
              <label for="login-password" class="hidden">Password</label>
              <input type="password" id="login-password" placeholder="Password" required>
              <button id="loging-button" type="submit">Log In</button>
              <p id="login-message" class="form-message"></p>
          </form>
          <form id="register-box">
              <label for="register-name" class="hidden">Name</label>
              <input type="text" id="register-name" placeholder="Name" required>
<!--              <br>-->
              <label for="register-email" class="hidden">Email</label>
              <input type="email" id="register-email" placeholder="Email" required>
<!--              <br>-->
              <label for="register-password" class="hidden">Password</label>
              <input type="password" id="register-password" placeholder="Password" required>
<!--              <br>-->
              <label for="register-password-confirm" class="hidden">Confirm Password</label>
              <input type="password" id="register-password-confirm" placeholder="Confirm Password" required>
              <button id="register-button" type="submit">Sign Up</button>
              <p id="register-message" class="form-message"></p>
          </form>
      </div>
  </main>

  <footer id="footer">
      <p id="copyright">©2026 Brown LLC</p>
      <ul id="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
      </ul>
  </footer>

</body>
</html>
