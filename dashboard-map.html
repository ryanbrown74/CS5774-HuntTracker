<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hunt Tracker</title>
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/pb.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/filter.js"></script>
  <script type="module" src="js/map.js"></script>
</head>
<body class="map-page">

<!-- This page is the map view of hunts -->

  <header id="header">

    <div id="title-box">
      <h1>Hunt Tracker</h1>
    </div><!-- #title-box -->

    <nav id="nav"></nav>

  </header><!-- #header -->

  <div id="year-bar">
    <ul id="year-list"></ul>
  </div>

  <div id="view-bar">
    <ul id="view-buttons">
      <li><a href="dashboard-list.html">List View</a></li>
      <li><a href="#" class="selected">Map View</a></li>
    </ul>
  </div>

  <main id="content">

    <!-- Map view contains an interactive map with markers.
         The map is initialized by map.js.-->
    <div id="map-container">
      <button id="create-new-map-button" class="add-new-map-button">Create new</button>
      <div id="map"></div>
      <div id="radius-popup" class="radius-popup" style="display: none;">
        <label for="radius-slider">Radius</label>
        <input type="range" id="radius-slider" min="10" max="2000" value="100" step="10">
        <span id="radius-value">100 yards</span>
        <button id="create-hunt-button">Create</button>
      </div>
    </div>

    <div class="selected-map-hunt" >
      <h2 class="placeholder-selected-hunt"> Select a hunt on the map</h2>
    </div>

  </main> <!-- content -->

  <footer id="footer">
      <p id="copyright">©2026 Brown LLC</p>
      <ul id="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
      </ul>
  </footer>

</body>
</html>
