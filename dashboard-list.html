<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hunt Tracker</title>
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module" src="js/pb.js"></script>
  <script type="module" src="js/scripts.js"></script>
  <script type="module" src="js/list.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/filter.js"></script>
</head>
<body>

<!-- This page is the list view of hunts -->

  <header id="header">

    <div id="title-box">
      <h1>Hunt Tracker</h1>
    </div><!-- #title-box -->

    <nav id="nav"></nav>

  </header><!-- #header -->

  <div id="year-bar">
    <ul id="year-list"></ul>
  </div>

  <div id="view-bar">
    <ul id="view-buttons">
      <li><a href="#" class="selected">List View</a></li>
      <li><a href="dashboard-map.html">Map View</a></li>
    </ul>
  </div>

  <main id="content">

    <!-- Status message -->
    <p id="status">Loading hunt logs…</p>

    <div id="hunt-list">

      <!-- Filled in by list.js -->

      <div id="create-new">
        <button id="create-new-button"><img src="images/add.png" alt="Add new hunt"></button>
        <h3>Create New</h3>
      </div>
    </div> <!-- hunt-list -->

  </main> <!-- content -->

  <footer id="footer">
      <p id="copyright">©2026 Brown LLC</p>
      <ul id="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
      </ul>
  </footer>

</body>
</html>
