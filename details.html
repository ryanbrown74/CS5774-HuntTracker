<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hunt Tracker</title>
  <link rel="stylesheet" type="text/css" href="css/global.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module" src="js/pb.js"></script>
  <script type="module" src="js/scripts.js"></script>
  <script type="module" src="js/details.js"></script>
  <script type="module" src="js/nav.js"></script>
</head>
<body class="details-page">

 <!-- This page -->

  <header id="header">

    <div id="title-box">
      <h1>Hunt Tracker</h1>
    </div><!-- #title-box -->

    <nav id="nav"></nav>

  </header><!-- #header -->

  <main id="content">
    <!-- Status message -->
    <p id="status">Loading Details…</p>

    <div id="hunt-definition">
      <div id="hunt-title-details">
        <h2></h2>
        <p class="harvest-status"></p>
        <p class="hunt-date"></p>
        <p class="weather"></p>
        <p class="hunt-location"></p>
      </div> <!-- hunt-title-details-->

      <a href="edit.html" id="edit-button">Edit</a>

      <div id="hunt-images">
        <img src="" alt="Hunt Image" class="featured-image">
        <div class="thumbnail-row">
        </div>
      </div> <!-- hunt-images-->
    </div>

    <div id="hunt-details">
      <div id="details-column">
        <div class="form-row">
          <label for="game-species">Game Species:</label>
          <input type="text" id="game-species" readonly>
        </div>
        <div class="form-row">
          <label for="method">Method:</label>
          <input type="text" id="method" readonly>
        </div>
        <div class="form-row">
          <label for="caliber">Caliber:</label>
          <input type="text" id="caliber" readonly>
        </div>
        <div class="form-row">
          <label for="ammo">Ammo:</label>
          <input type="text" id="ammo" readonly>
        </div>
        <div class="form-row">
          <label for="distance">Distance:</label>
          <input type="text" id="distance" readonly>
        </div>
        <div class="form-row">
          <label for="setup">Setup:</label>
          <input type="text" id="setup" readonly>
        </div>
        <div class="form-row">
          <label for="companions">Companions:</label>
          <input type="text" id="companions" readonly>
        </div>
      </div>
      <div id="gear-column">
        <div class="form-row">
          <label for="gear-used">Gear Used:</label>
          <textarea readonly id="gear-used"></textarea>
        </div>
        <div class="form-row">
          <label for="gear-needed">Gear Needed:</label>
          <textarea readonly id="gear-needed"></textarea>
        </div>
      </div>
      <div id="notes-column">
        <label for="notes">Notes:</label>
        <textarea readonly id="notes"></textarea>
      </div>
      <div id="details-buttons">
        <button id="previous-button">Previous</button>
        <button id="next-button">Next</button>
      </div>
    </div> <!-- hunt-details -->

  </main> <!-- content -->

  <footer id="footer">
      <p id="copyright">©2026 Brown LLC</p>
      <ul id="footer-links">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
      </ul>
  </footer>

</body>
</html>
